<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsWave - Multi-Feed RSS Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Times New Roman', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f7e7ff;
            color: #333;
            line-height: 1.6;
            padding-bottom: 60px; /* Space for fixed footer */
        }

        /* Header Styles */
        header {
            background-color: #a078b7;
            color: white;
            padding: 1.5rem;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
        }

        header p {
            margin: 0.5rem 0 0;
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Navigation */
        nav {
            display: flex;
            justify-content: center;
            background-color: #c7a6d9;
            padding: 0.7rem;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 1rem;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        nav a:hover {
            text-decoration: underline;
            transform: translateY(-2px);
        }

        /* Main Content */
        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        /* Feed Controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .feed-selector {
            flex: 1;
            min-width: 250px;
        }

        select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 1rem;
            font-family: 'Times New Roman', sans-serif;
            background-color: white;
            color: #333;
        }

        select:focus {
            outline: none;
            border-color: #a078b7;
        }

        button {
            background-color: #a078b7;
            color: white;
            border: none;
            padding: 0.7rem 1.5rem;
            border-radius: 5px;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        button:hover {
            background-color: #87539b;
        }

        /* Articles Grid */
        .articles-grid {
            display: grid;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }

        /* Article Card */
        .article-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .article-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.15);
        }

        .article-image {
            height: 200px;
            background-size: cover;
            background-position: center;
            position: relative;
        }

        .article-image::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 50%;
            background: linear-gradient(to top, rgba(0,0,0,0.7), transparent);
        }

        .article-source {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: #87539b;
            color: white;
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 1;
        }

        .article-content {
            padding: 1.5rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .article-content h3 {
            margin-bottom: 1rem;
            color: #333;
            font-size: 1.3rem;
        }

        .article-content p {
            color: #555;
            margin-bottom: 1.5rem;
            flex: 1;
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            font-size: 0.9rem;
            color: #666;
        }

        .article-date {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .read-more {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background-color: #a078b7;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 0.9rem;
            transition: background-color 0.3s ease;
        }

        .read-more:hover {
            background-color: #87539b;
        }

        /* Loading State */
        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem;
            text-align: center;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(160, 120, 183, 0.2);
            border-radius: 50%;
            border-top-color: #a078b7;
            animation: spin 1s linear infinite;
            margin-bottom: 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Error State */
        .error {
            padding: 2rem;
            text-align: center;
            background-color: #f8d7da;
            color: #721c24;
            border-radius: 10px;
            border: 1px solid #f5c6cb;
        }

        .error i {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #dc3545;
        }

        /* Empty State */
        .empty {
            padding: 2rem;
            text-align: center;
            color: #666;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            grid-column: 1 / -1;
        }

        .empty i {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #a078b7;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 1rem;
            background-color: #a078b7;
            color: white;
            position: fixed;
            width: 100%;
            bottom: 0;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .articles-grid {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 1.8rem;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .articles-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 901px) {
            .articles-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <header>
        <h1><i class="fas fa-newspaper"></i> NewsWave</h1>
        <p>Your personalized news dashboard</p>
    </header>

    <nav>
        <a href="#"><i class="fas fa-home"></i> Home</a>
        <a href="#"><i class="fas fa-bookmark"></i> Saved</a>
        <a href="#"><i class="fas fa-cog"></i> Settings</a>
    </nav>

    <main class="container">
        <div class="controls">
            <div class="feed-selector">
                <select id="feed-select">
                    <option value="" disabled selected>Select a news source</option>
                    <option value="https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml">NY Times</option>
                    <option value="https://feeds.bbci.co.uk/news/world/rss.xml">BBC World</option>
                    <option value="https://techcrunch.com/feed/">TechCrunch</option>
                    <option value="https://www.theguardian.com/world/rss">The Guardian</option>
                    <option value="https://www.wired.com/feed/rss">WIRED</option>
                </select>
            </div>
            <button id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
        </div>

        <div id="loading" class="loading" style="display: none;">
            <div class="spinner"></div>
            <p>Loading the latest news...</p>
        </div>

        <div id="articles" class="articles-grid">
            <div class="empty">
                <i class="fas fa-newspaper"></i>
                <p>Select a news source to begin</p>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2023 NewsWave | Built with <i class="fas fa-heart"></i> for news enthusiasts</p>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const feedSelect = document.getElementById('feed-select');
            const refreshBtn = document.getElementById('refresh-btn');
            const articlesContainer = document.getElementById('articles');
            const loadingIndicator = document.getElementById('loading');
            
            // Available feeds with display names
            const feeds = {
                "NY Times": "https://rss.nytimes.com/services/xml/rss/nyt/HomePage.xml",
                "BBC World": "https://feeds.bbci.co.uk/news/world/rss.xml",
                "TechCrunch": "https://techcrunch.com/feed/",
                "The Guardian": "https://www.theguardian.com/world/rss",
                "WIRED": "https://www.wired.com/feed/rss"
            };
            
            // Event listeners
            feedSelect.addEventListener('change', function() {
                const selectedFeed = this.value;
                if (selectedFeed) {
                    loadFeed(selectedFeed, this.options[this.selectedIndex].text);
                }
            });
            
            refreshBtn.addEventListener('click', function() {
                const selectedFeed = feedSelect.value;
                if (selectedFeed) {
                    loadFeed(selectedFeed, feedSelect.options[feedSelect.selectedIndex].text);
                } else {
                    showMessage('Please select a feed first', 'error');
                }
            });
            
            // Function to load feed
            function loadFeed(feedUrl, feedName) {
                // Show loading state
                articlesContainer.innerHTML = '';
                loadingIndicator.style.display = 'flex';
                
                // Use CORS proxy
                const proxyUrl = 'https://api.allorigins.win/get?url=';
                const encodedUrl = encodeURIComponent(feedUrl);
                
                fetch(`${proxyUrl}${encodedUrl}`)
                    .then(response => {
                        if (!response.ok) throw new Error('Network error');
                        return response.json();
                    })
                    .then(data => {
                        if (data.contents) {
                            parseFeed(data.contents, feedName);
                        } else {
                            throw new Error('Invalid feed data');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showMessage('Failed to load feed. Please try again.', 'error');
                    })
                    .finally(() => {
                        loadingIndicator.style.display = 'none';
                    });
            }
            
            // Function to parse RSS feed
            function parseFeed(xmlString, feedName) {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(xmlString, "text/xml");
                
                // Get all items
                const items = xmlDoc.querySelectorAll('item');
                
                if (items.length === 0) {
                    showMessage('No articles found in this feed.', 'empty');
                    return;
                }
                
                // Clear container
                articlesContainer.innerHTML = '';
                
                // Process each item
                items.forEach(item => {
                    const title = item.querySelector('title')?.textContent || 'No title available';
                    const description = item.querySelector('description')?.textContent || 'No description available';
                    const link = item.querySelector('link')?.textContent || '#';
                    const pubDate = item.querySelector('pubDate')?.textContent || '';
                    const media = item.querySelector('media\\:content, content')?.getAttribute('url') || 
                                 item.querySelector('enclosure')?.getAttribute('url') || 
                                 'https://source.unsplash.com/random/600x400/?news,' + feedName.replace(/\s+/g, '');
                    
                    // Create article card
                    const article = document.createElement('div');
                    article.className = 'article-card';
                    article.innerHTML = `
                        <div class="article-image" style="background-image: url('${media}')">
                            <span class="article-source">${feedName}</span>
                        </div>
                        <div class="article-content">
                            <h3>${title}</h3>
                            <p>${cleanDescription(description)}</p>
                            <div class="article-meta">
                                <span class="article-date">
                                    <i class="far fa-clock"></i>
                                    ${formatDate(pubDate)}
                                </span>
                                <a href="${link}" class="read-more" target="_blank" rel="noopener">
                                    Read <i class="fas fa-external-link-alt"></i>
                                </a>
                            </div>
                        </div>
                    `;
                    
                    articlesContainer.appendChild(article);
                });
            }
            
            // Helper function to clean description
            function cleanDescription(desc) {
                // Remove HTML tags
                let clean = desc.replace(/<[^>]*>?/gm, '');
                // Trim length
                if (clean.length > 150) {
                    clean = clean.substring(0, 150) + '...';
                }
                return clean;
            }
            
            // Helper function to format date
            function formatDate(dateString) {
                if (!dateString) return '';
                try {
                    const date = new Date(dateString);
                    return date.toLocaleDateString('en-US', {
                        month: 'short',
                        day: 'numeric',
                        year: 'numeric'
                    });
                } catch (e) {
                    return dateString.split(' ').slice(0, 4).join(' ');
                }
            }
            
            // Function to show messages
            function showMessage(message, type = 'empty') {
                articlesContainer.innerHTML = `
                    <div class="${type}">
                        <i class="fas fa-${type === 'error' ? 'exclamation-triangle' : 'newspaper'}"></i>
                        <p>${message}</p>
                    </div>
                `;
            }
        });
    </script>
</body>
</html>
